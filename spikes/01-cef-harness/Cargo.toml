[workspace]

[package]
name = "cef-harness"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
cef = { version = "156.2.0", default-features = false, features = ["accelerated_osr"] }
wgpu = "30"
pollster = "0.4"
bytemuck = "1"
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSResponder"] }
objc2-io-surface = "0.3.2"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
serde_json = "1"
png = "0.17"
blake3 = "1"
tungstenite = "0.26"
base64 = "0.22"
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-media = "0.3.2"
objc2-video-toolbox = "0.3.2"

[profile.release]
debug = 1
