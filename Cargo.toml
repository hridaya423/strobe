[workspace]
resolver = "3"
members = ["crates/vrf", "crates/vrf-cli", "crates/vrf-bench", "crates/vrf-blink", "crates/vrf-encode"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
version = "0.1.0"
