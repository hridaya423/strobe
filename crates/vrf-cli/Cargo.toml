[package]
name = "vrf-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "vrf"
path = "src/main.rs"

[dependencies]
vrf-blink = { path = "../vrf-blink" }
vrf-encode = { path = "../vrf-encode" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
