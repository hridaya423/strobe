<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#000}
#root{position:relative;width:320px;height:180px;overflow:hidden;background:linear-gradient(135deg,#123,#345)}
#box{position:absolute;left:20px;top:60px;width:60px;height:60px;border-radius:12px;background:#f84}
</style></head><body>
<div id="root" data-composition-id="tiny" data-width="320" data-height="180" data-duration="1" data-fps="10">
<div id="box"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
const tl = gsap.timeline({paused: true});
tl.to('#box', {x: 220, rotation: 90, duration: 1, ease: 'none'});
window.__timelines = {tiny: tl};
</script></body></html>
