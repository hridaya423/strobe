[package]
name = "vrf"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
vrf-encode = { path = "../vrf-encode" }
anyhow = "1.0.104"
pollster = "0.4.0"
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "std", "parking_lot"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.5"
objc2-core-foundation = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface"] }
wgpu = { version = "30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-video = { version = "0.3.2", features = ["objc2-io-surface"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Security",
] }
