<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Departure Mono";
        src: url("../assets/fonts/DepartureMono-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        src: url("../assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-weight: 100 900;
        src: url("../assets/fonts/Geist.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script src="../assets/bluenoise.js"></script>
    <script src="../js/engine.js"></script>
    <script>
      const { W, H, HEX, dither, light, boltPath } = SX;
      const art = new URLSearchParams(location.search).get("art");
      const RACES = {
        mac: ["MAC MINI, APPLE M4", [
          ["rm-github-unwrapped", "Remotion", 44.28, 6.10],
          ["rm-transitions-video", "Remotion", 13.79, 2.69],
          ["rm-4-0-trailer", "Remotion", 38.94, 10.12],
          ["hf-spacex-launch", "HyperFrames", 15.9, 4.5],
          ["hf-figma-launch", "HyperFrames", 30.69, 8.78],
          ["hf-heygen-stripe", "HyperFrames", 23.02, 7.45],
          ["hf-hyperframes-launch", "HyperFrames", 26.18, 9.46],
        ]],
        win: ["WINDOWS, RTX 4070 TI", [
          ["hf-spacex-launch", "HyperFrames", 59.4, 5.12],
          ["rm-transitions-video", "Remotion", 28.3, 3.49],
          ["hf-heygen-stripe", "HyperFrames", 61.3, 8.05],
          ["hf-hyperframes-launch", "HyperFrames", 85.9, 11.55],
          ["rm-github-unwrapped", "Remotion", 77.6, 10.78],
          ["hf-figma-launch", "HyperFrames", 77.0, 12.27],
          ["rm-4-0-trailer", "Remotion", 71.8, 15.63],
        ]],
      };

      function wordmark(ctx, size, cx, y, ink, bolt) {
        ctx.font = `italic 400 ${size}px "Instrument Serif"`;
        ctx.letterSpacing = `${-0.01 * size}px`;
        ctx.textBaseline = "alphabetic";
        const width = ctx.measureText("strobe").width;
        const x0 = cx - width / 2;
        const ox = x0 + ctx.measureText("str").width + ctx.measureText("o").width * 0.5;
        const oh = ctx.measureText("o").actualBoundingBoxAscent;
        ctx.fillStyle = ink;
        ctx.fillText("strobe", x0, y);
        ctx.letterSpacing = "0px";
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        boltPath(ctx, ox, y - oh * 0.5, oh * 1.55);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = bolt;
        boltPath(ctx, ox, y - oh * 0.5, oh * 1.05);
        ctx.fill();
        return { ox, oy: y - oh * 0.5, oh, width };
      }

      function mark(c, CW, CH, size, base, lines, r = 28) {
        c.width = CW;
        c.height = CH;
        const ctx = c.getContext("2d");
        ctx.fillStyle = HEX.night;
        ctx.beginPath();
        ctx.roundRect(0, 0, CW, CH, r);
        ctx.fill();
        ctx.save();
        ctx.clip();
        const ink = document.createElement("canvas");
        ink.width = CW;
        ink.height = CH;
        const { ox, oy, oh } = wordmark(ink.getContext("2d"), size, CW / 2, base, HEX.core, "rgba(0,0,0,0)");
        dither(ctx, 3, (f, k) => {
          f.globalCompositeOperation = "lighter";
          f.filter = `blur(${70 * k}px)`;
          light(f, 0.05);
          boltPath(f, ox * k, oy * k, oh * 2.6 * k);
          f.fill();
          f.filter = `blur(${22 * k}px)`;
          light(f, 0.09);
          boltPath(f, ox * k, oy * k, oh * 1.5 * k);
          f.fill();
          f.filter = "none";
          f.globalCompositeOperation = "source-over";
          const g = f.createLinearGradient(0, (oy - oh * 0.55) * k, 0, (oy + oh * 0.55) * k);
          const gray = (v) => {
            const q = Math.round(Math.pow(v, 1 / 2.2) * 255);
            return `rgb(${q},${q},${q})`;
          };
          g.addColorStop(0, gray(1));
          g.addColorStop(0.5, gray(0.78));
          g.addColorStop(1, gray(0.3));
          f.fillStyle = g;
          boltPath(f, ox * k, oy * k, oh * 1.05 * k);
          f.fill();
        });
        ctx.drawImage(ink, 0, 0);
        ctx.restore();
        ctx.textAlign = "center";
        lines.forEach(([text, font, color, y]) => {
          ctx.font = font;
          ctx.fillStyle = color;
          ctx.fillText(text, CW / 2, y);
        });
        ctx.strokeStyle = "rgba(143,227,255,0.10)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(1, 1, CW - 2, CH - 2, r);
        ctx.stroke();
      }

      function logo(c) {
        mark(c, 1200, 400, 250, 252, [["The fast render engine for HTML video", '500 36px "Geist"', "rgba(244,251,255,0.72)", 336]]);
      }

      function card(c) {
        mark(c, 1280, 640, 250, 318, [
          ["The fast render engine for HTML video", '500 40px "Geist"', "rgba(244,251,255,0.78)", 410],
          ["Remotion and HyperFrames, up to 11.6× faster", '500 30px "Geist"', HEX.ice, 462],
          ["github.com/hridaya423/strobe", '22px "Departure Mono"', "rgba(244,251,255,0.42)", 584],
        ], 0);
      }

      function chart(c, dark) {
        const ink = dark ? "#E6EDF3" : "#0B1220";
        const dim = dark ? "#7D8590" : "#57606A";
        const rule = dark ? "rgba(125,133,144,0.22)" : "rgba(87,96,106,0.18)";
        const track = dark ? "rgba(125,133,144,0.14)" : "rgba(87,96,106,0.09)";
        const rival = dark ? "#3D4A5C" : "#C9D1D9";
        const fast = HEX.electric;
        const panels = ["mac", "win"].map((k) => {
          const [machine, rows] = RACES[k];
          const by = Object.fromEntries(rows.map((r) => [r[0], r]));
          const max = Math.max(...rows.map((r) => r[2]));
          const best = Math.max(...rows.map((r) => r[2] / r[3]));
          return { machine, by, max, best };
        });
        const order = RACES.mac[1].map((r) => [r[0], r[1]]);
        const P = 56, rowH = 92, top = 92, Wc = 1600, Hc = top + order.length * rowH + 64;
        c.width = Wc + 2 * P;
        c.height = Hc + 2 * P;
        const ctx = c.getContext("2d");
        ctx.fillStyle = dark ? "#0D1117" : "#FFFFFF";
        ctx.beginPath();
        ctx.roundRect(0, 0, c.width, c.height, 24);
        ctx.fill();
        ctx.translate(P, P);
        const nameW = 384, gap = 44, pw = (Wc - nameW - gap) / 2, barW = 360;
        const px = [nameW, nameW + pw + gap];
        ctx.textBaseline = "alphabetic";
        ctx.font = '20px "Departure Mono"';
        ctx.fillStyle = dim;
        ctx.fillText("LAUNCH VIDEO", 0, 40);
        panels.forEach((pn, j) => {
          ctx.font = '600 26px "Geist"';
          ctx.fillStyle = ink;
          ctx.fillText(pn.machine === "MAC MINI, APPLE M4" ? "Mac mini, Apple M4" : "Windows, RTX 4070 Ti", px[j], 40);
          ctx.font = '20px "Departure Mono"';
          ctx.fillStyle = dim;
          ctx.textAlign = "right";
          ctx.fillText("SPEEDUP", px[j] + pw, 40);
          ctx.textAlign = "left";
        });
        ctx.fillStyle = rule;
        ctx.fillRect(0, 62, Wc, 1);
        ctx.fillRect(px[1] - gap / 2, 62, 1, order.length * rowH + 20);
        order.forEach(([name, who], i) => {
          const y = top + i * rowH;
          ctx.font = '26px "Departure Mono"';
          ctx.fillStyle = ink;
          ctx.fillText(name, 0, y + 22);
          ctx.font = '20px "Departure Mono"';
          ctx.fillStyle = dim;
          ctx.fillText(`vs ${who}`, 0, y + 52);
          panels.forEach((pn, j) => {
            const [, , slow, quick] = pn.by[name];
            const x = px[j];
            ctx.fillStyle = track;
            ctx.fillRect(x, y, barW, 22);
            ctx.fillStyle = rival;
            ctx.fillRect(x, y, (barW * slow) / pn.max, 22);
            ctx.fillStyle = fast;
            ctx.fillRect(x, y + 30, (barW * quick) / pn.max, 22);
            ctx.font = '18px "Departure Mono"';
            ctx.fillStyle = dim;
            ctx.fillText(`${slow.toFixed(1)} s`, x + Math.max(barW, (barW * slow) / pn.max) + 10, y + 18);
            ctx.fillStyle = ink;
            ctx.fillText(`${quick.toFixed(1)} s`, x + (barW * quick) / pn.max + 10, y + 48);
            const m = slow / quick;
            ctx.font = '600 44px "Geist"';
            ctx.textAlign = "right";
            ctx.fillStyle = m === pn.best ? fast : ink;
            ctx.fillText(`${m.toFixed(1)}×`, x + pw, y + 46);
            ctx.textAlign = "left";
          });
        });
        const ly = top + order.length * rowH + 40;
        ctx.font = '20px "Departure Mono"';
        ctx.fillStyle = rival;
        ctx.fillRect(0, ly - 16, 18, 18);
        ctx.fillStyle = dim;
        ctx.fillText("REMOTION OR HYPERFRAMES", 28, ly);
        ctx.fillStyle = fast;
        ctx.fillRect(340, ly - 16, 18, 18);
        ctx.fillStyle = dim;
        ctx.fillText("STROBE", 368, ly);
        ctx.textAlign = "right";
        ctx.fillText("WALL TIME IN SECONDS. EACH MACHINE HAS ITS OWN SCALE.", Wc, ly);
        ctx.textAlign = "left";
      }

      document.fonts.load('italic 330px "Instrument Serif"').then(() =>
        Promise.all([document.fonts.load('30px "Departure Mono"'), document.fonts.load('600 52px "Geist"'), document.fonts.load('500 38px "Geist"'), document.fonts.load('600 26px "Geist"')]).then(() => {
          const c = document.getElementById("c");
          if (art === "card") card(c);
          else if (art === "logo") logo(c);
          else chart(c, art.includes("dark"));
          document.title = "ready";
        }),
      );
    </script>
  </body>
</html>
