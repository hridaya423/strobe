<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Departure Mono";
        src: url("../assets/fonts/DepartureMono-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        src: url("../assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-weight: 100 900;
        src: url("../assets/fonts/Geist.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script src="../assets/bluenoise.js"></script>
    <script src="../js/engine.js"></script>
    <script>
      const { W, H, HEX, dither, light, boltPath } = SX;
      const art = new URLSearchParams(location.search).get("art");
      const RACE = [
        ["github-unwrapped", "Remotion", 44.28, 8.49],
        ["transitions-video", "Remotion", 13.79, 3.01],
        ["spacex-launch", "HyperFrames", 15.9, 4.46],
        ["figma-launch", "HyperFrames", 30.69, 8.71],
        ["heygen-stripe", "HyperFrames", 23.02, 7.63],
        ["hyperframes-launch", "HyperFrames", 26.18, 9.25],
        ["4-0-trailer", "Remotion", 38.94, 16.28],
      ];

      function wordmark(ctx, size, cx, y, ink, bolt) {
        ctx.font = `italic 400 ${size}px "Instrument Serif"`;
        ctx.letterSpacing = `${-0.01 * size}px`;
        ctx.textBaseline = "alphabetic";
        const width = ctx.measureText("strobe").width;
        const x0 = cx - width / 2;
        const ox = x0 + ctx.measureText("str").width + ctx.measureText("o").width * 0.5;
        const oh = ctx.measureText("o").actualBoundingBoxAscent;
        ctx.fillStyle = ink;
        ctx.fillText("strobe", x0, y);
        ctx.letterSpacing = "0px";
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        boltPath(ctx, ox, y - oh * 0.5, oh * 1.55);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = bolt;
        boltPath(ctx, ox, y - oh * 0.5, oh * 1.05);
        ctx.fill();
        return { ox, oy: y - oh * 0.5, oh, width };
      }

      function mark(c, CW, CH, size, base, lines, r = 28) {
        c.width = CW;
        c.height = CH;
        const ctx = c.getContext("2d");
        ctx.fillStyle = HEX.night;
        ctx.beginPath();
        ctx.roundRect(0, 0, CW, CH, r);
        ctx.fill();
        ctx.save();
        ctx.clip();
        const ink = document.createElement("canvas");
        ink.width = CW;
        ink.height = CH;
        const { ox, oy, oh } = wordmark(ink.getContext("2d"), size, CW / 2, base, HEX.core, "rgba(0,0,0,0)");
        dither(ctx, 3, (f, k) => {
          f.globalCompositeOperation = "lighter";
          f.filter = `blur(${70 * k}px)`;
          light(f, 0.05);
          boltPath(f, ox * k, oy * k, oh * 2.6 * k);
          f.fill();
          f.filter = `blur(${22 * k}px)`;
          light(f, 0.09);
          boltPath(f, ox * k, oy * k, oh * 1.5 * k);
          f.fill();
          f.filter = "none";
          f.globalCompositeOperation = "source-over";
          const g = f.createLinearGradient(0, (oy - oh * 0.55) * k, 0, (oy + oh * 0.55) * k);
          const gray = (v) => {
            const q = Math.round(Math.pow(v, 1 / 2.2) * 255);
            return `rgb(${q},${q},${q})`;
          };
          g.addColorStop(0, gray(1));
          g.addColorStop(0.5, gray(0.78));
          g.addColorStop(1, gray(0.3));
          f.fillStyle = g;
          boltPath(f, ox * k, oy * k, oh * 1.05 * k);
          f.fill();
        });
        ctx.drawImage(ink, 0, 0);
        ctx.restore();
        ctx.textAlign = "center";
        lines.forEach(([text, font, color, y]) => {
          ctx.font = font;
          ctx.fillStyle = color;
          ctx.fillText(text, CW / 2, y);
        });
        ctx.strokeStyle = "rgba(143,227,255,0.10)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(1, 1, CW - 2, CH - 2, r);
        ctx.stroke();
      }

      function logo(c) {
        mark(c, 1200, 400, 250, 252, [["The fast render engine for HTML video", '500 36px "Geist"', "rgba(244,251,255,0.72)", 336]]);
      }

      function card(c) {
        mark(c, 1280, 640, 250, 318, [
          ["The fast render engine for HTML video", '500 40px "Geist"', "rgba(244,251,255,0.78)", 410],
          ["Remotion and HyperFrames, up to 5.2× faster", '500 30px "Geist"', HEX.ice, 462],
          ["github.com/hridaya423/strobe", '22px "Departure Mono"', "rgba(244,251,255,0.42)", 584],
        ], 0);
      }

      function chart(c, dark) {
        const ink = dark ? "#E6EDF3" : "#0B1220";
        const dim = dark ? "#7D8590" : "#57606A";
        const track = dark ? "rgba(125,133,144,0.18)" : "rgba(87,96,106,0.12)";
        const rival = dark ? "#3D4A5C" : "#C9D1D9";
        const fast = HEX.electric;
        const P = 56, rowH = 92, top = 70, Wc = 1600, Hc = top + RACE.length * rowH + 30;
        c.width = Wc + 2 * P;
        c.height = Hc + 2 * P;
        const ctx = c.getContext("2d");
        ctx.fillStyle = dark ? "#0D1117" : "#FFFFFF";
        ctx.beginPath();
        ctx.roundRect(0, 0, c.width, c.height, 24);
        ctx.fill();
        ctx.translate(P, P);
        const L = 0, nameW = 360, barX = L + nameW, barW = 860, max = Math.max(...RACE.map((r) => r[2]));
        ctx.font = '20px "Departure Mono"';
        ctx.fillStyle = dim;
        ctx.textBaseline = "alphabetic";
        ctx.fillText("LAUNCH VIDEO", L, 30);
        ctx.fillText("WALL TIME, SECONDS", barX, 30);
        ctx.fillStyle = rival;
        ctx.fillRect(barX + 300, 14, 18, 18);
        ctx.fillStyle = dim;
        ctx.fillText("REMOTION OR HYPERFRAMES", barX + 328, 30);
        ctx.fillStyle = fast;
        ctx.fillRect(barX + 640, 14, 18, 18);
        ctx.fillStyle = dim;
        ctx.fillText("STROBE", barX + 668, 30);
        ctx.textAlign = "right";
        ctx.fillText("SPEEDUP", Wc, 30);
        ctx.textAlign = "left";
        RACE.forEach(([name, who, slow, quick], i) => {
          const y = top + i * rowH;
          ctx.font = '26px "Departure Mono"';
          ctx.fillStyle = ink;
          ctx.fillText(name, L, y + 22);
          ctx.font = '20px "Departure Mono"';
          ctx.fillStyle = dim;
          ctx.fillText(`vs ${who}`, L, y + 52);
          ctx.fillStyle = track;
          ctx.fillRect(barX, y, barW, 24);
          ctx.fillStyle = rival;
          ctx.fillRect(barX, y, (barW * slow) / max, 24);
          ctx.fillStyle = fast;
          ctx.fillRect(barX, y + 32, (barW * quick) / max, 24);
          ctx.font = '18px "Departure Mono"';
          ctx.fillStyle = dim;
          ctx.fillText(`${slow.toFixed(1)} s`, barX + (barW * slow) / max + 12, y + 19);
          ctx.fillStyle = ink;
          ctx.fillText(`${quick.toFixed(1)} s`, barX + (barW * quick) / max + 12, y + 51);
          ctx.font = '600 52px "Geist"';
          ctx.textAlign = "right";
          ctx.fillStyle = i === 0 ? fast : ink;
          ctx.fillText(`${(slow / quick).toFixed(1)}×`, Wc, y + 50);
          ctx.textAlign = "left";
        });
      }

      document.fonts.load('italic 330px "Instrument Serif"').then(() =>
        Promise.all([document.fonts.load('30px "Departure Mono"'), document.fonts.load('600 52px "Geist"'), document.fonts.load('500 38px "Geist"')]).then(() => {
          const c = document.getElementById("c");
          if (art === "card") card(c);
          else if (art === "logo") logo(c);
          else chart(c, art === "chart-dark");
          document.title = "ready";
        }),
      );
    </script>
  </body>
</html>
