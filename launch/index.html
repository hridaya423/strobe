<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Departure Mono";
        src: url("assets/fonts/DepartureMono-Regular.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        font-weight: 400;
        src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "Geist";
        font-weight: 100 900;
        src: url("assets/fonts/Geist.woff2") format("woff2");
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #04060d;
        font-family: "Geist", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04060d;
      }
      #film {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      #stills {
        display: none;
      }
      .warm {
        position: absolute;
        opacity: 0;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-fps="60" data-width="1920" data-height="1080">
      <canvas id="film" width="1920" height="1080" data-layout-allow-overflow></canvas>
      <div id="stills">
        <img src="assets/frames/f00.png" alt="" />
        <img src="assets/frames/f01.png" alt="" />
        <img src="assets/frames/f02.png" alt="" />
        <img src="assets/frames/f03.png" alt="" />
        <img src="assets/frames/f04.png" alt="" />
        <img src="assets/frames/f05.png" alt="" />
        <img src="assets/frames/f06.png" alt="" />
        <img src="assets/frames/f07.png" alt="" />
        <img src="assets/frames/f08.png" alt="" />
        <img src="assets/frames/f09.png" alt="" />
        <img src="assets/frames/f10.png" alt="" />
        <img src="assets/frames/f11.png" alt="" />
        <img src="assets/frames/f12.png" alt="" />
        <img src="assets/frames/f13.png" alt="" />
        <img src="assets/frames/f14.png" alt="" />
        <img src="assets/frames/f15.png" alt="" />
        <img src="assets/frames/f16.png" alt="" />
        <img src="assets/frames/f17.png" alt="" />
        <img src="assets/frames/f18.png" alt="" />
        <img src="assets/frames/f19.png" alt="" />
      </div>
      <span class="warm" style="font-family: 'Departure Mono'">.</span>
      <span class="warm" style="font-family: 'Geist'">.</span>
      <span class="warm" style="font-family: 'Instrument Serif'; font-style: italic; font-weight: 400">.</span>
    </div>
    <script src="assets/bluenoise.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/film.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.SX_BUILD.then(({ tl }) => {
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      });
    </script>
  </body>
</html>
