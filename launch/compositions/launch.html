<template>
  <style>
    @font-face {
      font-family: "Departure Mono";
      src: url("assets/fonts/DepartureMono-Regular.woff2") format("woff2");
    }
    #root {
      position: absolute;
      inset: 0;
      background: #04060d;
      overflow: hidden;
      font-family: Inter, sans-serif;
    }
    #launch-canvas {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }
    #launch-word {
      position: absolute;
      left: 693px;
      top: 540px;
      margin-top: -110px;
      font-size: 190px;
      line-height: 210px;
      font-weight: 800;
      letter-spacing: -0.055em;
      color: #f4fbff;
    }
    #launch-tagline {
      position: absolute;
      top: 718px;
      left: 0;
      right: 0;
      text-align: center;
      font: 34px/1 "Departure Mono", monospace;
      letter-spacing: 0.04em;
      color: #8fe3ff;
    }
    #launch-tagline span {
      display: inline-block;
    }
    #launch-flash {
      position: absolute;
      inset: 0;
      background: #f4fbff;
      opacity: 0;
    }
    #launch-cut {
      position: absolute;
      inset: 0;
      background: #04060d;
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="launch" data-width="1920" data-height="1080">
    <canvas id="launch-canvas" width="1920" height="1080"></canvas>
    <div id="launch-word">strobe</div>
    <div id="launch-tagline">
      <span>HTML</span> <span>to</span> <span>video.</span> <span>At</span> <span>the</span> <span>speed</span> <span>of</span> <span>light.</span>
    </div>
    <div id="launch-flash"></div>
    <div id="launch-cut"></div>
  </div>
  <script>
    (() => {
      const D = window.StrobeDither;
      const ctx = document.getElementById("launch-canvas").getContext("2d");
      const easeOut = gsap.parseEase("expo.out");
      const span = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
      const word = document.getElementById("launch-word");
      const BOLT_X = 693 - 58;

      function draw(t) {
        const p = easeOut(span(t, 0, 0.6));
        const scale = 6 - 5 * p;
        const cx = 960 + (BOLT_X - 960) * p;
        const cell = Math.round(28 - 24 * easeOut(span(t, 0, 0.7)));
        D.render(
          ctx,
          cell,
          (c, k) => D.bolt(c, k, { cx, cy: 540, h: 200 * scale, energy: 1.6 - 0.6 * p }),
          0.18 * (1 - p),
        );
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: 2.2, duration: 2.2, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      tl.fromTo(
        word,
        { clipPath: "inset(0% 100% 0% 0%)", filter: "blur(10px)" },
        { clipPath: "inset(0% 0% 0% 0%)", filter: "blur(0px)", duration: 0.38, ease: "power3.out" },
        0.4,
      );
      tl.fromTo(
        "#launch-tagline span",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.05, ease: "power2.out" },
        0.56,
      );
      tl.fromTo("#launch-flash", { opacity: 0 }, { opacity: 1, duration: 0.017, ease: "none" }, 2.03);
      tl.to("#launch-flash", { opacity: 0, duration: 0.017, ease: "none" }, 2.08);
      tl.to("#launch-flash", { opacity: 1, duration: 0.017, ease: "none" }, 2.11);
      tl.fromTo("#launch-cut", { opacity: 0 }, { opacity: 1, duration: 0.017, ease: "none" }, 2.16);
      draw(0);
      window.__timelines["launch"] = tl;
    })();
  </script>
</template>
