<template>
  <style>
    @font-face {
      font-family: "Departure Mono";
      src: url("assets/fonts/DepartureMono-Regular.woff2") format("woff2");
    }
    #root {
      position: absolute;
      inset: 0;
      background: #04060d;
      overflow: hidden;
      font-family: Inter, sans-serif;
    }
    #fast-grid {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(90deg, rgba(11, 42, 107, 0.55) 0 1px, transparent 1px 160px),
        repeating-linear-gradient(0deg, rgba(11, 42, 107, 0.35) 0 1px, transparent 1px 135px);
    }
    .fast-hud {
      position: absolute;
      top: 72px;
      font: 28px/1 "Departure Mono", monospace;
      color: #8fe3ff;
      letter-spacing: 0.04em;
    }
    #fast-counter {
      left: 96px;
    }
    #fast-spec {
      right: 96px;
      color: #2f7bff;
    }
    #fast-stack {
      position: absolute;
      inset: 0;
    }
    .fast-echo {
      position: absolute;
      left: 0;
      right: 0;
      top: 540px;
      margin-top: -120px;
      text-align: center;
      font-size: 220px;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 240px;
    }
    .fast-line {
      position: absolute;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #8fe3ff 70%, #f4fbff);
    }
    #fast-word {
      position: absolute;
      left: 0;
      right: 0;
      top: 540px;
      margin-top: -170px;
      display: flex;
      justify-content: center;
      font-size: 320px;
      line-height: 340px;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #f4fbff;
    }
    #fast-word span {
      display: inline-block;
    }
    #fast-word .fast-ice {
      color: #8fe3ff;
    }
    #fast-flash {
      position: absolute;
      inset: 0;
      background: #f4fbff;
    }
  </style>
  <div id="root" data-composition-id="fast" data-width="1920" data-height="1080">
    <div id="fast-grid"></div>
    <div id="fast-counter" class="fast-hud" data-layout-ignore>FRAME 0000 / 1692</div>
    <div id="fast-spec" class="fast-hud" data-layout-ignore>STROBE RENDER · 1080P60</div>
    <div id="fast-lines" data-layout-allow-overflow></div>
    <div id="fast-stack" data-layout-allow-overflow data-layout-allow-overlap>
      <div class="fast-echo" style="color: #0b2a6b">render</div>
      <div class="fast-echo" style="color: #0b2a6b">render</div>
      <div class="fast-echo" style="color: #0b2a6b">render</div>
      <div class="fast-echo" style="color: #0b2a6b">render</div>
      <div class="fast-echo" style="color: #2f7bff">render</div>
      <div class="fast-echo" style="color: #2f7bff">render</div>
      <div class="fast-echo" style="color: #8fe3ff">render</div>
      <div class="fast-echo" style="color: #8fe3ff">render</div>
      <div class="fast-echo" style="color: #f4fbff">render</div>
    </div>
    <div id="fast-word" data-layout-allow-overflow data-layout-allow-overlap>
      <span id="fast-f">f</span><span id="fast-a1">a</span><span id="fast-a2" class="fast-ice">a</span><span id="fast-a3" class="fast-ice">a</span><span id="fast-s">s</span><span id="fast-t">t</span>
    </div>
    <div id="fast-flash"></div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const hash = (n) => {
        const x = Math.sin(n * 91.7 + 17.3) * 43758.5453;
        return x - Math.floor(x);
      };

      tl.fromTo("#fast-flash", { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "expo.out" }, 0);

      const echoes = gsap.utils.toArray("#fast-stack .fast-echo");
      const offsets = [-4, 4, -3, 3, -2, 2, -1, 1, 0];
      echoes.forEach((el, i) => {
        const o = offsets[i];
        tl.fromTo(
          el,
          { y: 0, opacity: o === 0 ? 1 : 0 },
          { y: o * 92, opacity: 1, duration: 0.42, ease: "expo.out" },
          0.04 + Math.abs(o) * 0.025,
        );
      });
      tl.fromTo(
        "#fast-stack",
        { x: 0, filter: "blur(0px)" },
        { x: -2400, filter: "blur(18px)", duration: 0.26, ease: "power3.in" },
        0.56,
      );

      const lines = document.getElementById("fast-lines");
      for (let i = 0; i < 18; i++) {
        const el = document.createElement("div");
        el.className = "fast-line";
        el.style.top = `${120 + hash(i) * 840}px`;
        el.style.width = `${280 + hash(i + 40) * 760}px`;
        el.style.opacity = `${0.35 + hash(i + 80) * 0.65}`;
        lines.appendChild(el);
        tl.fromTo(el, { x: 2000 }, { x: -1400, duration: 0.34 + hash(i + 9) * 0.2, ease: "none" }, 0.46 + hash(i + 3) * 0.36);
      }

      const counter = document.getElementById("fast-counter");
      const count = { f: 0 };
      tl.to(
        count,
        {
          f: 1692,
          duration: 1.4,
          ease: "power2.in",
          onUpdate: () => {
            counter.textContent = `FRAME ${String(Math.round(count.f)).padStart(4, "0")} / 1692`;
          },
        },
        0,
      );

      const aw = document.getElementById("fast-a1").offsetWidth;
      tl.fromTo(
        "#fast-word",
        { x: 900, opacity: 0, filter: "blur(24px)" },
        { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.24, ease: "expo.out" },
        0.78,
      );
      tl.fromTo(["#fast-s", "#fast-t"], { x: -2 * aw }, { x: 0, duration: 0.34, ease: "expo.out" }, 0.98);
      tl.fromTo("#fast-a3", { x: -2 * aw, opacity: 0 }, { x: 0, opacity: 1, duration: 0.34, ease: "expo.out" }, 0.98);
      tl.fromTo("#fast-a2", { x: -aw, opacity: 0 }, { x: 0, opacity: 1, duration: 0.34, ease: "expo.out" }, 0.98);
      tl.to("#fast-word", { x: -2200, filter: "blur(20px)", duration: 0.12, ease: "power3.in" }, 1.48);

      window.__timelines["fast"] = tl;
    })();
  </script>
</template>
