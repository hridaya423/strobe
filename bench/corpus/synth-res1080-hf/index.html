<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>synth-res1080</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #10131c; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Helvetica, Arial, sans-serif; }
    #scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(1); background: radial-gradient(circle at 30% 20%, #26335f, #10131c 70%); }
    #title { position: absolute; left: 120px; top: 100px; margin: 0; font-size: 110px; font-weight: 700; color: #f4f6ff; letter-spacing: -2px; }
    #sub { position: absolute; left: 124px; top: 240px; font-size: 40px; color: #9fb4ff; }
    .card { position: absolute; width: 260px; height: 160px; border-radius: 24px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); }
    #ring { position: absolute; left: 1360px; top: 120px; width: 400px; height: 400px; border-radius: 50%; border: 24px solid #6ea8ff; border-top-color: #ff6b6b; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
    <div id="scene">
      <h1 id="title">Resolution</h1>
      <div id="sub">One scene, three sizes</div>
      <div id="ring"></div>
    </div>
  </div>
  <script>
    const scene = document.getElementById("scene");
    const colors = ["#ff6b6b", "#ffd166", "#06d6a0", "#6ea8ff", "#c77dff", "#ff9f1c"];
    for (let i = 0; i < 12; i++) {
      const card = document.createElement("div");
      card.className = "card";
      card.style.background = `linear-gradient(135deg, ${colors[i % 6]}, #1b2a55)`;
      card.style.left = 120 + (i % 6) * 290 + "px";
      card.style.top = 600 + Math.floor(i / 6) * 190 + "px";
      scene.appendChild(card);
    }
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#title", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0);
    tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, 0.3);
    tl.fromTo("#ring", { rotation: 0 }, { rotation: 360, duration: 3, ease: "none" }, 0);
    document.querySelectorAll(".card").forEach((card, i) => {
      tl.fromTo(card, { y: 200, opacity: 0, rotation: -8 }, { y: 0, opacity: 1, rotation: 0, duration: 0.8, ease: "back.out(1.4)" }, 0.4 + i * 0.08);
      tl.to(card, { y: -24, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.4 + (i % 6) * 0.05);
    });
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
