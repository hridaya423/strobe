<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>synth-long</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1020; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: linear-gradient(135deg, #0b1020, #1b2a55); font-family: Helvetica, Arial, sans-serif; }
    #title { position: absolute; left: 160px; top: 120px; margin: 0; font-size: 120px; font-weight: 700; color: #f4f6ff; }
    .dot { position: absolute; left: 0; top: 0; width: 96px; height: 96px; border-radius: 50%; }
    #bar { position: absolute; left: 160px; top: 960px; width: 1600px; height: 12px; background: #26335f; border-radius: 6px; overflow: hidden; }
    #fill { width: 100%; height: 100%; background: #6ea8ff; transform-origin: left center; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
    <h1 id="title">Sixty seconds</h1>
    <div class="dot" style="background: #ff6b6b"></div>
    <div class="dot" style="background: #ffd166"></div>
    <div class="dot" style="background: #06d6a0"></div>
    <div class="dot" style="background: #6ea8ff"></div>
    <div id="bar"><div id="fill"></div></div>
  </div>
  <script>
    function rng(seed) {
      return function () {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const random = rng(7);
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0);
    document.querySelectorAll(".dot").forEach((dot) => {
      let x = 200 + random() * 1400;
      let y = 300 + random() * 500;
      tl.set(dot, { x, y }, 0);
      for (let t = 0; t < 60; t += 2) {
        x = 100 + random() * 1600;
        y = 300 + random() * 540;
        tl.to(dot, { x, y, scale: 0.5 + random() * 1.2, duration: 2, ease: "power2.inOut" }, t);
      }
    });
    tl.fromTo("#fill", { scaleX: 0 }, { scaleX: 1, duration: 60, ease: "none" }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
