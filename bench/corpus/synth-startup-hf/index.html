<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>synth-startup</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1020; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: linear-gradient(135deg, #0b1020, #1b2a55); font-family: Helvetica, Arial, sans-serif; }
    #title { position: absolute; left: 160px; top: 380px; margin: 0; font-size: 140px; font-weight: 700; color: #f4f6ff; }
    .dot { position: absolute; left: 160px; width: 96px; height: 96px; border-radius: 50%; }
    #bar { position: absolute; left: 160px; top: 900px; width: 1600px; height: 12px; background: #26335f; border-radius: 6px; overflow: hidden; }
    #fill { width: 100%; height: 100%; background: #6ea8ff; transform-origin: left center; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1920" data-height="1080">
    <h1 id="title">Startup</h1>
    <div class="dot" style="top: 560px; background: #ff6b6b"></div>
    <div class="dot" style="top: 640px; background: #ffd166"></div>
    <div class="dot" style="top: 720px; background: #06d6a0"></div>
    <div id="bar"><div id="fill"></div></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
    document.querySelectorAll(".dot").forEach((dot, i) => {
      tl.fromTo(dot, { x: 0, scale: 0.4 }, { x: 1500, scale: 1, duration: 1.6, ease: "power2.inOut" }, i * 0.1);
    });
    tl.fromTo("#fill", { scaleX: 0 }, { scaleX: 1, duration: 2, ease: "none" }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
