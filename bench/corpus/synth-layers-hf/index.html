<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>synth-layers</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #090b14; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(circle at 50% 50%, #1a1f3a, #090b14 75%); }
    .layer { position: absolute; left: 0; top: 0; border-radius: 28%; will-change: transform, opacity; }
    .shadow { box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6), 0 0 24px rgba(255, 255, 255, 0.15); }
    .blur { filter: blur(6px); }
    .glow { filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.55)); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080"></div>
  <script>
    function rng(seed) {
      return function () {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const random = rng(11);
    const root = document.getElementById("root");
    const hues = [350, 40, 160, 215, 275, 30];
    const tl = gsap.timeline({ paused: true });
    for (let i = 0; i < 400; i++) {
      const size = 60 + random() * 160;
      const layer = document.createElement("div");
      layer.className = "layer" + (i % 4 === 0 ? " shadow" : "") + (i % 10 === 1 ? " blur" : "") + (i % 10 === 2 ? " glow" : "");
      layer.style.width = layer.style.height = size + "px";
      layer.style.background = `linear-gradient(${random() * 360}deg, hsl(${hues[i % 6]} 85% 60%), hsl(${hues[(i + 2) % 6]} 80% 40%))`;
      root.appendChild(layer);
      const from = { x: random() * 1800, y: random() * 960, rotation: random() * 360, scale: 0.6 + random() * 0.6, opacity: 0.35 + random() * 0.6 };
      const to = { x: random() * 1800, y: random() * 960, rotation: from.rotation + 90 + random() * 270, scale: 0.4 + random() * 1.0, opacity: 0.3 + random() * 0.7 };
      tl.fromTo(layer, from, { ...to, duration: 5, ease: "sine.inOut" }, 0);
    }
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
